name: Deploy
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build tracker
        working-directory: ./expense-tracker
        run: |
          npm install
          npm run build
          cp -r dist/*.
          rm -rf dist
      - name: Push build
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add expense-tracker/
          git commit -m "auto build [skip ci]" || exit 0
          git push
