name: Deploy
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Build
        run: |
          cd expense-tracker
          npm install
          npm run build
          cp -r dist/*.
          rm -rf dist
      - name: Commit build
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add expense-tracker/
          git commit -m "build [skip ci]" || echo "no changes"
          git push
