name: Deploy
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: cd expense-tracker && npm install && npm run build
      - run: |
          cp -r expense-tracker/dist/* expense-tracker/
          rm -rf expense-tracker/dist
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add expense-tracker
          git commit -m "build [skip ci]" || echo "no changes"
          git push
